name: Publish to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build, Test & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance attestation via OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install QSV binary (Linux)
        run: |
          curl -fsSL https://github.com/dathere/qsv/releases/download/26.0.0/qsv-26.0.0-x86_64-unknown-linux-musl.zip -o /tmp/qsv.zip
          sudo unzip -o /tmp/qsv.zip qsv -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/qsv
          rm -f /tmp/qsv.zip

      - name: Verify QSV installation
        run: qsv --version

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linters & Tests
        run: |
          pnpm run lint
          pnpm run test

      - name: Build Package
        run: pnpm run build

      - name: Publish to NPM with Provenance (OIDC)
        run: pnpm publish --access public --no-git-checks --provenance
